<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>LTL 管理 - 选手赏金</title>
  <link rel="stylesheet" href="src/styles/main.css" />
  <link rel="stylesheet" href="src/styles/admin-theme.css" />
</head>
<body class="admin-site">
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="index.html"><img class="brand-logo" src="assets/ltl-logo.webp" alt="LTL联赛" /></a>
      <button class="nav-toggle" id="navToggle" aria-label="展开导航">☰</button>
      <div class="nav-links" id="navLinks"></div>
    </nav>
  </header>
  <main class="page-shell">
    <section class="section">
      <div class="section-heading row">
        <div>
          <p class="eyebrow">ADMIN · BOUNTY</p>
          <h1 class="page-title">选手赏金</h1>
          <p class="muted">管理选手的赏金币（🪙），用于下赛季任务系统。赏金币与积分相互独立。</p>
        </div>
      </div>

      <div class="panel" style="padding:1rem;margin-top:1rem;">
        <div class="admin-form-grid" style="display:grid;grid-template-columns:2fr 1fr;gap:.75rem;">
          <label class="field"><span class="field-label">选手</span><select class="input" id="filterPlayer"><option value="">全部选手</option></select></label>
          <label class="field"><span class="field-label">所属小组</span><select class="input" id="filterTeam"><option value="">全部</option></select></label>
        </div>
        <div style="display:flex;gap:.5rem;margin-top:.75rem;"><button class="btn primary" id="refreshBtn" type="button">刷新</button></div>
      </div>

      <div class="panel" style="margin-top:1rem;overflow:auto;">
        <table class="admin-table" style="width:100%;border-collapse:collapse;">
          <thead>
            <tr>
              <th style="text-align:left;padding:.75rem 1rem;">选手</th>
              <th style="text-align:left;padding:.75rem 1rem;">所属小组</th>
              <th style="text-align:left;padding:.75rem 1rem;">赏金 🪙</th>
              <th style="text-align:left;padding:.75rem 1rem;">操作</th>
            </tr>
          </thead>
          <tbody id="bountyBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="bountyDialog" style="max-width: 480px; width: calc(100% - 2rem); border: 1px solid rgba(126,200,255,.28); background: rgba(12, 22, 48, 0.95); color: var(--text); border-radius: 16px; padding: 0; box-shadow: var(--shadow);">
    <div style="padding: 1rem;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap: 1rem;">
        <h2 style="margin:0; font-size: 1.1rem;" id="dialogTitle">调整赏金</h2>
        <button class="btn ghost" id="closeDialogBtn" type="button">关闭</button>
      </div>

      <div style="margin-top:.75rem;">
        <p class="muted" id="dialogPlayerName"></p>
        <label class="field">
          <span class="field-label">调整金额（正数增加，负数扣减）</span>
          <input class="input" id="formAmount" type="number" />
        </label>
        <label class="field">
          <span class="field-label">原因（可选）</span>
          <input class="input" id="formReason" placeholder="调整原因" />
        </label>
      </div>

      <div style="display:flex; justify-content: flex-end; gap: .5rem; margin-top: 1rem;">
        <button class="btn primary" type="button" id="saveBtn">保存</button>
      </div>

      <input type="hidden" id="formPlayerId" />
    </div>
  </dialog>

  <script type="module" src="src/util/admin-auth.js"></script>
  <script type="module" src="src/admin/player-bounty.js"></script>
  <script src="src/components/admin-nav.js"></script>
</body>
</html>
