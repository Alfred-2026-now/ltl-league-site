<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>队长管理 - LTL联赛</title>
  <link rel="stylesheet" href="src/styles/main.css" />
  <style>
    .captain-main { max-width: 1080px; margin: 2rem auto; padding: 0 1.25rem; }
    .captain-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }
    .section-title {
      font-size: 1.15rem; font-weight: 700; margin: 0 0 1rem;
      color: var(--text);
      display: flex; align-items: center; gap: 0.55rem;
    }
    .section-title::before {
      content: ""; width: 4px; height: 18px; border-radius: 2px;
      background: linear-gradient(180deg, var(--blue), var(--purple));
    }
    .team-grid {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 1.75rem;
      align-items: start;
    }
    @media (max-width: 820px) { .team-grid { grid-template-columns: 1fr; } }
    .team-logo-box { text-align: center; }
    .team-logo {
      width: 110px; height: 110px; border-radius: 16px;
      object-fit: cover; border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
    }
    .team-logo-empty {
      width: 110px; height: 110px; border-radius: 16px;
      border: 1px dashed var(--line);
      display: grid; place-items: center;
      color: var(--muted); font-size: 0.8rem;
      background: rgba(255,255,255,0.02);
    }
    .logo-actions { margin-top: 0.5rem; }
    .logo-actions input[type="file"] { color: var(--muted); font-size: 0.75rem; }
    .team-info h2 {
      margin: 0 0 0.75rem; font-size: 1.6rem; font-weight: 800;
      background: linear-gradient(90deg, var(--text), var(--cyan));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .team-info textarea {
      width: 100%; background: rgba(255,255,255,0.04);
      border: 1px solid var(--line); border-radius: 10px;
      color: var(--text); padding: 0.6rem 0.8rem; font-size: 0.92rem;
      font-family: inherit; resize: vertical; box-sizing: border-box;
    }
    .team-info textarea:focus { outline: none; border-color: var(--blue); }
    .desc-row { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.5rem; }
    .desc-msg { font-size: 0.8rem; min-height: 1rem; }
    .fund-panel {
      background: linear-gradient(135deg, rgba(25,168,255,0.10), rgba(140,92,255,0.10));
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1rem 1.1rem;
      min-width: 240px;
    }
    .fund-row { margin-bottom: 0.65rem; }
    .fund-label { font-size: 0.74rem; color: var(--muted); margin-bottom: 0.15rem; letter-spacing: 0.04em; }
    .fund-value { font-size: 1.55rem; font-weight: 800; font-family: "SF Mono", "Consolas", monospace; line-height: 1.1; }
    .fund-value.gold { color: var(--gold); }
    .fund-value.cyan { color: var(--cyan); }
    .fund-divider { border: none; border-top: 1px solid var(--line); margin: 0.75rem 0; }
    .fund-transfer-label { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.4rem; }
    .fund-transfer-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .fund-transfer-row input {
      background: rgba(255,255,255,0.05); border: 1px solid var(--line);
      border-radius: 8px; color: var(--text); padding: 0.45rem 0.6rem; font-size: 0.88rem;
    }
    .fund-transfer-row input:focus { outline: none; border-color: var(--blue); }
    .fund-msg { font-size: 0.78rem; min-height: 1rem; margin: 0.4rem 0 0; }
    .members-wrap { margin-top: 1.5rem; }
    .members-table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .members-table th {
      text-align: left; padding: 0.7rem 0.9rem; font-size: 0.76rem;
      color: var(--muted); font-weight: 600; letter-spacing: 0.05em;
      border-bottom: 1px solid var(--line);
    }
    .members-table td {
      padding: 0.75rem 0.9rem; border-bottom: 1px solid rgba(126,200,255,0.10); color: var(--text); font-size: 0.92rem;
    }
    .members-table tr:last-child td { border-bottom: none; }
    .members-table tr:hover td { background: rgba(25,168,255,0.06); }
    .role-tag {
      display: inline-block; padding: 2px 10px; border-radius: 999px;
      font-size: 0.72rem; font-weight: 600;
    }
    .role-tag.captain { background: linear-gradient(135deg, var(--gold), #ff9a3c); color: #1a1206; }
    .role-tag.sub { background: rgba(121,231,255,0.16); color: var(--cyan); }
    .role-tag.member { background: rgba(168,182,214,0.14); color: var(--muted); }
    .btn { cursor: pointer; border-radius: 999px; padding: 0.5rem 1rem; font-size: 0.88rem; font-weight: 600; transition: all 0.15s; font-family: inherit; }
    .btn.primary {
      background: linear-gradient(135deg, var(--blue), var(--purple));
      border: 1px solid transparent; color: #fff;
    }
    .btn.primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(25,168,255,0.35); }
    .btn.ghost { background: rgba(255,255,255,0.04); border: 1px solid var(--line); color: var(--text); }
    .btn.ghost:hover { background: rgba(25,168,255,0.12); border-color: var(--blue); }
    .btn.sm { padding: 0.32rem 0.75rem; font-size: 0.8rem; }
    .notice { text-align: center; padding: 2.5rem 1rem; }
    .notice h2 { color: var(--cyan); margin: 0 0 0.5rem; }
    .notice p { color: var(--muted); margin: 0; }
    .error-notice { color: var(--gold); margin: 0; }
    dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; color: var(--text); box-shadow: var(--shadow); }
    dialog input {
      background: rgba(255,255,255,0.05); border: 1px solid var(--line);
      border-radius: 8px; color: var(--text); padding: 0.5rem 0.7rem; font-family: inherit; font-size: 0.92rem;
    }
    dialog input:focus { outline: none; border-color: var(--blue); }
    dialog label { color: var(--muted); font-size: 0.82rem; }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="index.html"><span class="brand-mark">LTL</span><span class="brand-text">联赛规则中心</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="展开导航">☰</button>
      <div class="nav-links" id="navLinks"></div>
    </nav>
  </header>

  <main class="captain-main">
    <section id="errorNotice" class="captain-card notice" style="display:none;">
      <p id="errorMessage" class="error-notice"></p>
    </section>

    <section id="noTeamNotice" class="captain-card notice" style="display:none;">
      <h2>尚未归属队伍</h2>
      <p>您当前未归属任何队伍，请联系管理员分配队伍后再使用队长功能。</p>
    </section>

    <section id="teamSection" class="captain-card" style="display:none;">
      <div class="team-grid">
        <div class="team-logo-box">
          <div id="logoPreview"></div>
          <div class="logo-actions">
            <input type="file" id="logoFile" accept="image/*" />
            <div style="margin-top:0.4rem;"><button class="btn ghost sm" id="uploadLogoBtn">上传图标</button></div>
            <p id="logoMsg" class="fund-msg"></p>
          </div>
        </div>

        <div class="team-info">
          <h2 id="teamTitle"></h2>
          <textarea id="descriptionInput" rows="2" placeholder="一句话介绍你的队伍"></textarea>
          <div class="desc-row">
            <button class="btn ghost sm" id="saveDescBtn">保存简介</button>
            <span id="descMsg" class="desc-msg"></span>
          </div>
        </div>

        <div class="fund-panel">
          <div class="fund-row">
            <div class="fund-label">队伍 P 币</div>
            <div class="fund-value gold" id="teamCoinsDisplay">-</div>
          </div>
          <div class="fund-row">
            <div class="fund-label">队长个人存款</div>
            <div class="fund-value cyan" id="captainDepositDisplay">-</div>
          </div>
          <hr class="fund-divider" />
          <div class="fund-transfer-label">队长 → 队伍资金（无手续费）</div>
          <div class="fund-transfer-row">
            <input type="number" id="depositAmount" min="1" step="1" placeholder="金额" style="width:90px;" />
            <input type="text" id="depositReason" placeholder="备注" style="flex:1; min-width:90px;" />
          </div>
          <button class="btn primary sm" id="depositBtn" style="margin-top:0.5rem; width:100%;">转入队伍</button>
          <p id="depositMsg" class="fund-msg"></p>
        </div>
      </div>
    </section>

    <section id="membersSection" class="members-wrap" style="display:none;">
      <div class="captain-card">
        <h3 class="section-title">队员名单</h3>
        <div style="overflow-x:auto;">
          <table class="members-table">
            <thead>
              <tr>
                <th>姓名</th><th>位置</th><th>身价</th><th>存款</th><th>角色</th><th style="text-align:right;">操作</th>
              </tr>
            </thead>
            <tbody id="membersBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <dialog id="salaryDialog" style="padding:1.5rem; min-width: 340px;">
    <h3 style="margin-top:0; color: var(--cyan);">发放工资</h3>
    <p style="margin:0.5rem 0;">发放给：<strong id="salaryTargetName"></strong></p>
    <p style="margin:0.5rem 0;">队伍P币余额：<strong style="color: var(--gold);" id="salaryTeamBalance"></strong></p>
    <label style="display:block; margin: 0.75rem 0 0.25rem;">金额（P币）</label>
    <input type="number" id="salaryAmount" min="1" step="1" style="width:100%; box-sizing:border-box;" />
    <label style="display:block; margin: 0.75rem 0 0.25rem;">备注（可选）</label>
    <input type="text" id="salaryReason" style="width:100%; box-sizing:border-box;" />
    <p id="salaryError" style="color:var(--gold); min-height: 1.2rem; margin:0.6rem 0 0; font-size:0.85rem;"></p>
    <div style="display:flex; gap:0.5rem; justify-content:flex-end; margin-top:1rem;">
      <button id="salaryCancel" class="btn ghost">取消</button>
      <button id="salaryConfirm" class="btn primary">确认发放</button>
    </div>
  </dialog>

  <footer class="footer"><p>队长管理｜管理队伍信息、资金、工资发放。</p></footer>
  <script type="module" src="src/features/captain.js"></script>
  <script src="src/components/public-nav.js"></script>
</body>
</html>
